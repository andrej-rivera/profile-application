spring:
  application:
    name: spring-react-project
  datasource:
    url: jdbc:postgresql://localhost:5432/spring_react_project
    username: andre
    password: pass
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      # set to either update or create-drop. update will update and maintain the schema, while create drop will create the schema on startup and drop it on shutdown.
      ddl-auto: update
    show-sql: true

server:
  port: 443
  ssl:
    key-store: /etc/letsencrypt/live/api.andrej-rivera.com/keystore.p12
    key-store-password: changeit
    key-store-type: PKCS12

frontend:
  url: ${FRONTEND_URL:https://andre-profile-app.netlify.app}

logging:
  level:
    org:
      springframework:
        security: TRACE